name: Build and Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: leepanel-windows
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: leepanel-macos-intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: leepanel-macos-arm
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: leepanel-linux
    runs-on: ${{ matrix.platform }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version and signing secrets
        id: get_version
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)

          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$TAURI_VERSION"
          test "$VERSION" = "$CARGO_VERSION"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@v0.0.9

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Test MCP integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib mcp::tests

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: 'true'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LeePanel ${{ github.ref_name }}"
          releaseBody: |
            ## v1.0.26 更新说明

            - 修复 Docker/Podman 拉取镜像时进度日志导致页面自动跳动的问题。
            - 修复终端复制快捷键被误发送到远端、导致选区清除的问题。
            - 新增终端选中文字后按 Enter 直接复制到剪贴板，并保留选中状态。
            - 优化终端鼠标模式处理，兼容组合控制参数并允许正确退出鼠标跟踪。
            - 增加终端复制快捷键和鼠标模式回归测试。
            - 版本号更新至 `v1.0.26`。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  generate-updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get release assets info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"

          ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets: $ASSETS"

          # Windows
          EXE_NAME=$(echo "$ASSETS" | grep -E '\.exe$' | grep -v '\.sig' | head -1)
          EXE_URL="https://github.com/$REPO/releases/download/$TAG/$EXE_NAME"
          EXE_SIG_NAME=$(echo "$ASSETS" | grep -E '\.exe\.sig$' | head -1)

          # macOS Intel
          DMG_INTEL_NAME=$(echo "$ASSETS" | grep -E 'x64.*\.app\.tar\.gz$' | grep -v '\.sig' | head -1)
          DMG_INTEL_URL="https://github.com/$REPO/releases/download/$TAG/$DMG_INTEL_NAME"
          DMG_INTEL_SIG_NAME=$(echo "$ASSETS" | grep -E 'x64.*\.app\.tar\.gz\.sig$' | head -1)

          # macOS ARM
          DMG_ARM_NAME=$(echo "$ASSETS" | grep -E 'aarch64.*\.app\.tar\.gz$' | grep -v '\.sig' | head -1)
          DMG_ARM_URL="https://github.com/$REPO/releases/download/$TAG/$DMG_ARM_NAME"
          DMG_ARM_SIG_NAME=$(echo "$ASSETS" | grep -E 'aarch64.*\.app\.tar\.gz\.sig$' | head -1)

          # Linux updater artifact (createUpdaterArtifacts: true)
          APPIMAGE_NAME=$(echo "$ASSETS" | grep -E '\.AppImage$' | grep -v '\.sig' | head -1)
          APPIMAGE_URL="https://github.com/$REPO/releases/download/$TAG/$APPIMAGE_NAME"
          APPIMAGE_SIG_NAME=$(echo "$ASSETS" | grep -E '\.AppImage\.sig$' | head -1)

          # Download signatures
          for name in "$EXE_NAME" "$EXE_SIG_NAME" "$DMG_INTEL_NAME" "$DMG_INTEL_SIG_NAME" "$DMG_ARM_NAME" "$DMG_ARM_SIG_NAME" "$APPIMAGE_NAME" "$APPIMAGE_SIG_NAME"; do
            test -n "$name"
          done

          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir ./sigs

          get_sig() {
            local name="$1"
            if [ -n "$name" ] && [ -f "./sigs/$name" ]; then
              cat "./sigs/$name"
            else
              echo ""
            fi
          }

          EXE_SIG=$(get_sig "$EXE_SIG_NAME")
          DMG_INTEL_SIG=$(get_sig "$DMG_INTEL_SIG_NAME")
          DMG_ARM_SIG=$(get_sig "$DMG_ARM_SIG_NAME")
          APPIMAGE_SIG=$(get_sig "$APPIMAGE_SIG_NAME")

          for signature in "$EXE_SIG" "$DMG_INTEL_SIG" "$DMG_ARM_SIG" "$APPIMAGE_SIG"; do
            test -n "$signature"
          done

          # Generate update.json
          mkdir -p updater-feed
          cat > updater-feed/update.json << EOF
          {
            "version": "$VERSION",
            "notes": "LeePanel $TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$EXE_SIG",
                "url": "$EXE_URL"
              },
              "darwin-x86_64": {
                "signature": "$DMG_INTEL_SIG",
                "url": "$DMG_INTEL_URL"
              },
              "darwin-aarch64": {
                "signature": "$DMG_ARM_SIG",
                "url": "$DMG_ARM_URL"
              },
              "linux-x86_64": {
                "signature": "$APPIMAGE_SIG",
                "url": "$APPIMAGE_URL"
              }
            }
          }
          EOF

          jq empty updater-feed/update.json
          cat updater-feed/update.json
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy update.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./updater-feed
          publish_branch: gh-pages
          keep_files: true
          destination_dir: .
          force_copy: false
        if: startsWith(github.ref, 'refs/tags/v')

